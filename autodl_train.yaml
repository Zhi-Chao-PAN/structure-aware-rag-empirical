# AutoDL Optimized Training Configuration for A800-80GB
# Based on project handshake specs

model:
  backbone: "vidore/colpali-v1.2"
  projection_dim: 128
  img_size: 1024
  patch_size: 14
  has_cls: true
  gamma: 0.1
  gate_init_bias: -2.0
  freeze_backbone_epochs: 2

loss:
  tau_init: 0.02      # Conservative to prevent collapse
  tau_self: 0.1
  learn_tau: true    # Enable tau learning
  lambda_meta: 0.7
  lambda_self_max: 0.3
  mu: 0.5
  w_min: 0.05

ema:
  momentum_init: 0.999
  momentum_final: 0.9995
  warmup_epochs: 3    # Earlier EMA participation

curriculum:
  lambda_self_warmup_steps: 500
  easy_epochs: 2      # phase 1: easy
  hard_epoch_start: 4 # phase 3: hard
  n_industries_easy: 8
  n_industries_balanced: 4
  n_industries_hard: 2

data:
  batch_size: 16      # A800-80GB can handle 16; larger batch = better contrastive learning
  num_workers: 8
  pdf_dir: "data/raw_pdfs"
  page_image_dir: "data/vision_rag/page_images"
  mask_cache_dir: "data/vision_rag/spatial_masks"
  metadata_dir: "data/vision_rag"
  bm25_index_path: "data/vision_rag/bm25_index"
  visfinqa_dir: "data/vision_rag/visfinqa"
  bm25_top_k: 50

train:
  num_epochs: 15      # First production run validation
  lr: 2.0e-5          # ULTRA-CONSERVATIVE: Reduced to prevent gradient explosion
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  mixed_precision: "bf16"
  log_interval: 20
  eval_interval_epochs: 1
  checkpoint_dir: "checkpoints/vision_rag"
  wandb_project: "vision-rag-financial-a800"
  seed: 42

eval:
  top_k_pages: [1, 5, 10]
  top_k_patches: 10
  vgs_iou_threshold: 0.1
  grs_beta: 0.5
