name: Offline validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: black --check .
      - run: flake8 . --select=E9,F63,F7,F82 --show-source --statistics
      - run: python -m pytest tests -v --junitxml=junit.xml
      - run: python scripts/validate_dataset.py
      - run: bandit -r src -ll -ii -f json -o bandit-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.python-version }}
          path: |
            junit.xml
            bandit-report.json
