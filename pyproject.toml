[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "structure-aware-rag"
version = "0.1.0"
description = "An empirical study on structure-aware parsing for Financial RAG"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Zhichao Pan", email = "your.email@example.com"}
]
dependencies = [
    "llama-index-core==0.10.11",
    "llama-index-readers-file==0.1.0",
    "llama-index-llms-ollama==0.1.2",
    "llama-index-embeddings-huggingface==0.1.3",
    "llama-parse==0.3.0",
    "pandas==2.2.0",
    "matplotlib==3.8.2",
    "seaborn==0.13.0",
    "python-dotenv==1.0.0",
    "torch==2.1.2",
    "transformers==4.36.2",
    "pypdf==4.0.0",
    "pdfplumber==0.10.3",
    "nest-asyncio==1.5.8",
    "requests==2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest==8.0.0",
    "black",
    "ruff"
]
